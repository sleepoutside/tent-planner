<p class="foot">優缺點與評分是對整個帳型的一般性比較，同一類型裡不同款式的差異可能很大，選購前請以實際商品規格為準。3D 為依結構類型製作的概念造型，不是特定品牌型號；尺寸為該類型的常見大小。<br><b>設計/Sleepoutside Camp</b> *非營利使用　資訊僅供參考，請依官方資訊為準。</p>

/* ---------- builders shared with the simulator (copied from index.html) ---------- */
function rnd(seed){var s=seed;return function(){s=(s*9301+49297)%233280;return s/233280}}
function tex(kind){
  var cv=document.createElement('canvas'); cv.width=cv.height=256; var g=cv.getContext('2d'); var r=rnd(7),i;
  if(kind==='grass'){
    g.fillStyle='#7fa35f'; g.fillRect(0,0,256,256);
    for(i=0;i<2600;i++){ g.fillStyle=r()>.5?'rgba(60,110,50,.35)':'rgba(170,200,120,.3)'; g.fillRect(r()*256,r()*256,1.5,3+r()*3); }
  }else if(kind==='land'){
    g.fillStyle='#6f9058'; g.fillRect(0,0,256,256);
    for(i=0;i<2200;i++){ g.fillStyle=r()>.5?'rgba(50,90,45,.35)':'rgba(140,170,100,.25)'; g.fillRect(r()*256,r()*256,2,4); }
  }else if(kind==='gravel'){
    g.fillStyle='#b9b3a6'; g.fillRect(0,0,256,256);
    for(i=0;i<1800;i++){ var c=120+Math.floor(r()*110); g.fillStyle='rgb('+c+','+(c-4)+','+(c-12)+')'; g.beginPath(); g.arc(r()*256,r()*256,1+r()*3,0,6.3); g.fill(); }
  }else if(kind==='deck'){
    g.fillStyle='#b98d5e'; g.fillRect(0,0,256,256);
    for(i=0;i<8;i++){ g.fillStyle=i%2?'rgba(90,55,25,.10)':'rgba(255,230,190,.10)'; g.fillRect(0,i*32,256,32); g.fillStyle='rgba(60,35,15,.55)'; g.fillRect(0,i*32,256,2); }
    for(i=0;i<300;i++){ g.fillStyle='rgba(80,50,25,.12)'; g.fillRect(r()*256,r()*256,10+r()*30,1); }
  }else{
    g.fillStyle='#b4b1a7'; g.fillRect(0,0,256,256);
    for(i=0;i<900;i++){ g.fillStyle='rgba(90,90,85,.10)'; g.fillRect(r()*256,r()*256,2,2); }
  }
  var t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; return t;
}
function label(text,scale,color){
  var cv=document.createElement('canvas'); var g=cv.getContext('2d');
  var font='600 44px -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  g.font=font; var w=Math.ceil(g.measureText(text).width)+44; cv.width=w; cv.height=72;
  g=cv.getContext('2d'); g.font=font;
  g.fillStyle=color||'rgba(34,48,42,.9)';
  var x=0,y=0,h=72,rr=18; g.beginPath(); g.moveTo(x+rr,y); g.arcTo(x+w,y,x+w,y+h,rr); g.arcTo(x+w,y+h,x,y+h,rr); g.arcTo(x,y+h,x,y,rr); g.arcTo(x,y,x+w,y,rr); g.closePath(); g.fill();
  g.fillStyle='#fff'; g.textBaseline='middle'; g.fillText(text,22,38);
  var t=new THREE.CanvasTexture(cv); t.minFilter=THREE.LinearFilter;
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
  var k=(scale||1)*0.34; sp.scale.set(k*w/72,k,1); sp.renderOrder=10; return sp;
}
function dispose(o){
  o.traverse(function(n){
    if(n.geometry) n.geometry.dispose();

  else if(ptrs.size===2){ cam.r=Math.min(40,Math.max(3,pinch.r*pinch.d/pdist())); redraw(); } });
function pend(e){ ptrs.delete(e.pointerId); if(ptrs.size===1){ var p=Array.from(ptrs.values())[0]; last.x=p.x; last.y=p.y; } }
canvas.addEventListener('pointerup',pend); canvas.addEventListener('pointercancel',pend);
canvas.addEventListener('wheel',function(e){ e.preventDefault(); cam.r=Math.min(40,Math.max(3,cam.r*Math.exp(e.deltaY*0.0012))); redraw(); },{passive:false});
function setSpin(v){ spin=v; var b=$('spin'); b.setAttribute('aria-pressed',String(v)); b.textContent='自動旋轉：'+(v?'開':'關'); }
$('spin').addEventListener('click',function(){ setSpin(!spin); });
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) setSpin(false);

resize(); show(TYPES[0]);
var lastT=0;
(function loop(t){ var dt=Math.min(.05,((t||0)-lastT)/1000); lastT=t||0; if(spin){ cam.az+=dt*.22; dirty=true; } if(dirty){ dirty=false; applyCam(); renderer.render(scene,camera); } requestAnimationFrame(loop); })();
})();
</script>
</body>

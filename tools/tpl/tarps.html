<div class="wide">
  <p>評分與優缺點是各種搭法之間的一般性比較，實際表現會因天幕尺寸、材質、營柱高度和現場風向而不同。3D 為概念造型，營柱高度與營繩位置是常見的抓法，不是唯一的搭法。風大時不論哪種搭法都要多加營繩，必要時直接收起來。</p>
  <p><b>設計/Sleepoutside Camp</b> *非營利使用　資訊僅供參考，請依官方資訊為準。</p>

var ptrs=new Map(),last={x:0,y:0},pinch={d:1,r:1};
function pdist(){ var a=Array.from(ptrs.values()); return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1; }
canvas.addEventListener('pointerdown',function(e){ try{canvas.setPointerCapture(e.pointerId)}catch(_){ } ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); setSpin(false); last.x=e.clientX; last.y=e.clientY; if(ptrs.size===2){ pinch.d=pdist(); pinch.r=cam.r; } });
canvas.addEventListener('pointermove',function(e){ if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ cam.az-=(e.clientX-last.x)*0.008; cam.el=Math.min(1.45,Math.max(0.06,cam.el+(e.clientY-last.y)*0.006)); last.x=e.clientX; last.y=e.clientY; redraw(); }
  else if(ptrs.size===2){ cam.r=Math.min(40,Math.max(5,pinch.r*pinch.d/pdist())); redraw(); } });
function pend(e){ ptrs.delete(e.pointerId); if(ptrs.size===1){ var p=Array.from(ptrs.values())[0]; last.x=p.x; last.y=p.y; } }
canvas.addEventListener('pointerup',pend); canvas.addEventListener('pointercancel',pend);
canvas.addEventListener('wheel',function(e){ e.preventDefault(); cam.r=Math.min(40,Math.max(5,cam.r*Math.exp(e.deltaY*0.0012))); redraw(); },{passive:false});

resize(); show(PITCHES[0]);
var lastT=0;
(function loop(t){ var dt=Math.min(.05,((t||0)-lastT)/1000); lastT=t||0; if(spin){ cam.az+=dt*.25; dirty=true; } if(dirty){ dirty=false; applyCam(); renderer.render(scene,camera); } requestAnimationFrame(loop); })();
})();
</script>
</body>
